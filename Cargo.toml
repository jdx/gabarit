[package]
name = "gabarit"
version = "0.1.0"
edition = "2021"
description = "Toolbelt for coding agents — forge, discover, and run project-local tools (jigs)"
license = "MIT"
repository = "https://github.com/jdx/gabarit"
homepage = "https://github.com/jdx/gabarit"
keywords = ["agent", "mcp", "cli", "tools", "ai"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "gabarit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
usage-lib = { version = "6.0", features = ["docs"] }
rmcp = { version = "2.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "process", "time"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ignore = "0.4"
regex = "1"
indexmap = "2"
shell-words = "1"
heck = "0.5"
eyre = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
